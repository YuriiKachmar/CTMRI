async function loadVisitState(visitId){
  const snap = await getDocs(query(collection(db, 'records'), where('visitId', '==', visitId)));
  const recs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.sequentialNumber || 0) - (b.sequentialNumber || 0));
  if (!recs.length) return null;
  const f = recs[0];
  let pat = { name: f.patientName || '', birthDate: f.patientBirth || '', address: f.patientAddress || '' };
  if (f.patientId){ try { const p = await getDoc(doc(db, 'patients', f.patientId)); if (p.exists()) pat = { ...pat, ...p.data() }; } catch (_) {} }
  const ref = f.referral || {};
  return {
    isNew: false, id: visitId, date: f.date, time: f.time, createdBy: f.createdBy, pid: f.patientId || null,
    pname: pat.name || '', pbirth: isoToUa(pat.birthDate), pphone: pat.phone || '', paddr: pat.address || '',
    labelId: f.labelId || '', hist: f.historyNo || '',
    refKey: ref.self ? 'self' : ref.doctorId ? `d:${ref.doctorId}:${ref.institutionId || ''}` : '', refSnap: ref.doctorName || '',
    labId: f.labTechId || '', docId: f.describerId || '', removed: [],
    services: recs.map(r => ({
      rid: r.id, sequentialNumber: r.sequentialNumber, monthlyNumber: r.monthlyNumber, serviceId: r.serviceId, svcName: r.serviceSnapshot?.name || '',
      basePrice: r.servicePrice, discountId: r.discountId || '', discName: r.discountSnapshot?.name || '',
      pct: r.customDiscountPercent != null ? r.customDiscountPercent : (r.discountSnapshot?.percent || 0), discComment: r.customDiscountComment || '',
      extras: (r.extras || []).map(e => ({ ...e })), comment: r.comment || '', described: !!r.described,
      method: r.paymentMethod || null, paid: !!r.paid, paidDate: r.paidDate || null, labId: r.labTechId || '', docId: r.describerId || ''
    }))
  };
}
function openVisitForm(visitId){
  if (visitId){
    loadVisitState(visitId).then(vs => { if (vs) visitWin(vs); else toast('e', 'Візит не знайдено', 'Можливо, його вже видалили.'); })
      .catch(e => toast('e', 'Не вдалося відкрити візит', e.code || ''));
  } else {
    const vs = { isNew: true, id: null, date: todayISO(), time: nowTime(), createdBy: profile.id, pid: null, pname: '', pbirth: '', pphone: '', paddr: '', labelId: '', hist: '', refKey: '',
      refSnap: '', labId: profile.role === 'Лаборант' ? profile.id : '', docId: '', removed: [], services: [] };
    vs.services.push(newSvc(vs));
    visitWin(vs);
  }
}
function visitWin(vs){
  const nums = vs.services.map(s => s.sequentialNumber).filter(Boolean);
  const title = vs.isNew ? 'Новий візит' : 'Редагування візиту — № ' + (nums.length > 1 ? nums[0] + '–' + nums[nums.length - 1] : nums[0] || '');
  const ov = formWin(title, '<div data-vb></div>', (o) => saveVisit(o, vs), 820, vs.isNew ? 'Зберегти візит' : 'Зберегти зміни');
  const vb = ov.querySelector('[data-vb]'), scroller = ov.querySelector('.win-b');
  const render = () => { const y = scroller.scrollTop; vb.innerHTML = visitBodyHtml(vs); scroller.scrollTop = y; upd(); };
  const upd = () => {
    vs.services.forEach((s, i) => { const c = vb.querySelector(`[data-calc="${i}"]`), v = vb.querySelector(`[data-sum="${i}"]`); if (c) c.textContent = calcText(s); if (v) v.textContent = nfmt(calcSvc(s).total) + ' грн'; });
    const tot = r2(vs.services.reduce((a, s) => a + calcSvc(s).total, 0)), n = vs.services.length;
    const paid = r2(vs.services.filter(s => s.paid).reduce((a, s) => a + calcSvc(s).total, 0));
    vb.querySelector('[data-vcnt]').textContent = `Разом за візит · ${n} ${n === 1 ? 'послуга' : n < 5 ? 'послуги' : 'послуг'}`;
    vb.querySelector('[data-vtot]').textContent = nfmt(tot) + ' грн';
    vb.querySelector('[data-vsub]').textContent = n ? `оплачено ${nfmt(paid)} · не оплачено ${nfmt(r2(tot - paid))}` : '';
  };
  ov._render = render;       // зміни довідників (наприклад новий лікар) перемальовують форму зі стану
  ov._vs = vs;
  render();
  vb.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.stopPropagation(); });   // Enter у полі не зберігає весь візит
  const setAll = (k, v) => vs.services.forEach(s => { s[k] = v; });
  let sugTimer = null;
  const showSug = (list) => {
    const box = vb.querySelector('[data-sug]'); if (!box) return;
    if (!list.length){ box.hidden = true; return; }
    box.innerHTML = list.map((p, k) => `<div data-sp="${k}">${esc(p.name)}<small>${esc([isoToUa(p.birthDate), p.phone, p.address].filter(Boolean).join(' · '))}</small></div>`).join('');
    box.hidden = false; box._list = list;
  };
  vb.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.vf){
      const f = t.dataset.vf; vs[f] = t.value;
      if (f === 'pname' && vs.isNew){
        vs.pid = null; clearTimeout(sugTimer);
        const q = t.value.trim().toLowerCase();
        if (q.length < 2) return showSug([]);
        sugTimer = setTimeout(async () => {
          try {
            const snap = await getDocs(query(collection(db, 'patients'), where('nameLower', '>=', q), where('nameLower', '<=', q + ''), limit(8)));
            if (vs.pname.trim().toLowerCase() === q) showSug(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          } catch (_) {}
        }, 250);
      }
    } else if (t.dataset.k && t.dataset.i !== undefined){
      const s = vs.services[+t.dataset.i];
      if (t.dataset.k === 'pct'){ const v = Number(String(t.value).replace(',', '.')); s.pct = Number.isFinite(v) ? v : 0; }
      else s[t.dataset.k] = t.value;
      upd();
    }
  });
  vb.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.dataset.vs === 'ref'){
      if (t.value === 'new'){
        t.value = vs.refKey || '';
        return openDocForm(null, (id) => { const d = dir.doctors.find(x => x.id === id); vs.refKey = `d:${id}:${(d?.institutionIds || [])[0] || ''}`; render(); });
      }
      vs.refKey = t.value;
    } else if (t.dataset.vs === 'lab'){ vs.labId = t.value; setAll('labId', t.value); }
    else if (t.dataset.vs === 'doc'){ vs.docId = t.value; setAll('docId', t.value); }
    else if (t.dataset.k === 'service'){
      const s = vs.services[+t.dataset.i], x = dir.services.find(y => y.id === t.value);
      s.serviceId = t.value; s.svcName = x?.name || ''; s.basePrice = x ? x.price : 0;
      render();
    } else if (t.dataset.k === 'disc'){
      const s = vs.services[+t.dataset.i], x = dir.discounts.find(y => y.id === t.value);
      s.discountId = t.value; s.discName = x?.name || ''; s.pct = x && x.percent != null ? x.percent : 0; s.discComment = '';
      render();
    }
  });
  vb.addEventListener('click', (e) => {
    const t = e.target;
    const dot = t.closest('[data-dot]'), sp = t.closest('[data-sp]'), ex = t.closest('[data-ex]'), sg = t.closest('[data-sg]'), al = t.closest('[data-all]');
    const del = t.closest('[data-del]'), opt = t.closest('[data-opt]');
    if (dot){ vs.labelId = vs.labelId === dot.dataset.dot ? '' : dot.dataset.dot; render(); }
    else if (sp){
      const p = vb.querySelector('[data-sug]')._list[+sp.dataset.sp];
      vs.pid = p.id; vs.pname = p.name; vs.pbirth = isoToUa(p.birthDate); vs.pphone = p.phone || ''; vs.paddr = p.address || ''; render();
    }
    else if (ex){
      const s = vs.services[+ex.dataset.i], k = s.extras.findIndex(x => x.extraId === ex.dataset.ex);
      if (k >= 0) s.extras.splice(k, 1);
      else { const x = dir.extras.find(y => y.id === ex.dataset.ex); s.extras.push({ extraId: x.id, name: x.name, price: x.price }); }
      render();
    }
    else if (sg){
      const s = vs.services[+sg.dataset.i];
      if (sg.dataset.sg === 'method') s.method = sg.dataset.v; else s.paid = sg.dataset.v === 'paid';
      render();
    }
    else if (al){ if (al.dataset.all === 'method') setAll('method', al.dataset.v); else setAll('paid', al.dataset.v === 'paid'); render(); }
    else if (opt){ if (canDescribe()){ const s = vs.services[+opt.dataset.opt]; s.described = !s.described; render(); } }
    else if (t.closest('[data-add]')){ vs.services.push(newSvc(vs)); render(); vb.querySelectorAll('.vs')[vs.services.length - 1]?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    else if (del){
      const i = +del.dataset.del, s = vs.services[i];
      const remove = () => { if (s.rid) vs.removed.push(s.rid); vs.services.splice(i, 1); render(); };
      if (!s.rid) return remove();
      if (vs.services.length === 1){
        confirmWin({ type: 'e', title: 'Це остання послуга візиту.', details: 'Видалення останньої послуги видалить увесь візит разом із оплатою. Це незворотно.', action: 'Видалити візит', onOk: () => deleteVisit(ov, vs) });
      } else {
        confirmWin({ type: 'w', title: `Видалити послугу № ${s.sequentialNumber}?`, details: 'Послугу буде прибрано з візиту після натискання «Зберегти зміни».', action: 'Видалити', onOk: remove });
      }
    }
  });
  if (!vs.isNew && isAdminRole()){
    const f = ov.querySelector('.win-f');
    f.insertAdjacentHTML('afterbegin', '<button class="b red" data-delv>Видалити візит</button>');
    f.querySelector('[data-delv]').onclick = () => confirmWin({ type: 'e', title: 'Видалити візит?', details: 'Буде видалено візит, усі його послуги й записи про оплату. Це незворотно.', action: 'Видалити візит', onOk: () => deleteVisit(ov, vs) });
  }
}

function deleteVisit(ov, vs){
  const b = writeBatch(db);
  b.delete(doc(db, 'visits', vs.id));
  const ids = [...vs.services.map(s => s.rid), ...vs.removed].filter(Boolean);
  for (const id of ids){ b.delete(doc(db, 'records', id)); b.delete(doc(db, 'payments', id)); }
  audit('delete', 'visits', vs.id, { date: vs.date, patient: vs.pname, records: ids }, null);
  b.commit().catch(e => toast('e', 'Не вдалося видалити візит', e.code || ''));
  closeWin(ov); toast('ok', 'Візит видалено', '');
}

async function saveVisit(ov, vs){
  const name = vs.pname.trim();
  if (!name) return ['Введіть ПІБ пацієнта', ''];
  let birth = '';
  if (vs.pbirth.trim()){
    birth = uaToIso(vs.pbirth);
    if (!birth) return ['Некоректна дата народження', 'Формат: ДД.ММ.РРРР, наприклад 12.04.1978.'];
    if (birth > todayISO()) return ['Дата народження в майбутньому', 'Перевірте рік.'];
  }
  if (!vs.refKey) return ['Оберіть скерування', 'Самоскерування або лікуючий лікар.'];
  if (!vs.labId) return ['Оберіть лаборанта', 'Хто виконав послуги цього візиту.'];
  if (!vs.services.length) return ['Додайте хоча б одну послугу', ''];
  for (let i = 0; i < vs.services.length; i++){
    const s = vs.services[i], n = i + 1;
    if (!s.serviceId) return [`Послуга ${n}: оберіть послугу`, 'Список береться з довідника «Послуги».'];
    if (dir.discounts.find(d => d.id === s.discountId)?.isCustom && !(s.pct > 0 && s.pct <= 100)) return [`Послуга ${n}: вкажіть знижку`, 'Для «призначеної» пільги — число від 0 до 100.'];
    if (s.paid && !s.method) return [`Послуга ${n}: оберіть форму оплати`, 'Оплачену послугу не можна лишити без форми оплати.'];
  }
  if (vs.isNew){ vs.date = todayISO(); vs.time = nowTime(); }   // дата й час візиту — момент збереження (форма могла бути відкрита до півночі)
  const me = profile.id, now = serverTimestamp();
  /* пацієнт: обраний із бази — оновлюємо його картку; новий — шукаємо точний збіг (ПІБ + дата народження), інакше створюємо */
  let pid = vs.pid;
  const phone = vs.pphone.trim(), digits = phone.replace(/\D/g, '');
  const pdata = { name, nameLower: name.toLowerCase(), birthDate: birth, address: vs.paddr.trim(), phone, phoneDigits: digits, phoneRev: digits.split('').reverse().join('') };
  if (!pid){
    try {
      const snap = await getDocs(query(collection(db, 'patients'), where('nameLower', '==', pdata.nameLower)));
      const m = snap.docs.find(d => (d.data().birthDate || '') === birth);
      if (m) pid = m.id;
    } catch (_) {}
  }
  if (pid) setDoc(doc(db, 'patients', pid), { ...pdata, updatedAt: now }, { merge: true }).catch(e => toast('e', 'Не вдалося зберегти пацієнта', e.code || ''));
  else { const pr = doc(collection(db, 'patients')); pid = pr.id; setDoc(pr, { ...pdata, createdAt: now, createdBy: me }).catch(e => toast('e', 'Не вдалося зберегти пацієнта', e.code || '')); }
  /* номери нових послуг */
  const fresh = vs.services.filter(s => !s.rid);
  let base = { seq: 0, mseq: 0 };
  if (fresh.length){
    try { base = await allocNumbers(fresh.length); }
    catch (e){ return ['Не вдалося отримати номер', 'Нова послуга потребує з\'єднання з інтернетом. ' + (e.code || '')]; }
  }
  const visitId = vs.id || doc(collection(db, 'visits')).id;
  const ref = vs.refKey === 'self' ? { self: true } : (() => { const [, did, iid] = vs.refKey.split(':'); const d = dir.doctors.find(x => x.id === did);
    return { self: false, doctorId: did, institutionId: iid || null, doctorName: d?.name || vs.refSnap || '', institutionName: iid ? instNameById(iid) : '' }; })();
  const vis = { patientId: pid, patientName: name, patientBirth: birth, patientAddress: vs.paddr.trim(), patientPhone: phone, labelId: vs.labelId || '', historyNo: vs.hist.trim(), referral: ref, describerId: vs.docId || '', labTechId: vs.labId || '' };
  const batch = writeBatch(db);
  let total = 0, k = 0;
  const names = [];
  for (const s of vs.services){
    const c = calcSvc(s), rid = s.rid || doc(collection(db, 'records')).id, rref = doc(db, 'records', rid);
    total += c.total; names.push(s.svcName || dir.services.find(x => x.id === s.serviceId)?.name || '');
    const custom = dir.discounts.find(d => d.id === s.discountId)?.isCustom;
    const paidDate = s.paid ? (s.paidDate || todayISO()) : null;
    const data = {
      ...vis, visitId, date: vs.date, time: vs.time, serviceId: s.serviceId, serviceSnapshot: { name: s.svcName || dir.services.find(x => x.id === s.serviceId)?.name || '', price: c.base },
      extras: s.extras.map(e => ({ extraId: e.extraId, name: e.name, price: e.price })), discountId: s.discountId || '',
      discountSnapshot: s.discountId ? { name: s.discName, percent: c.pct } : null,
      customDiscountPercent: custom ? c.pct : null, customDiscountComment: custom ? s.discComment.trim() : '',
      servicePrice: c.base, discountAmount: c.disc, servicePriceAfterDiscount: c.after, extrasTotal: c.ex, totalAmount: c.total,
      comment: s.comment.trim(), described: !!s.described, paid: !!s.paid, paymentMethod: s.method || null, paidDate, updatedAt: now
    };
    if (!s.rid){ data.sequentialNumber = base.seq + (++k); data.monthlyNumber = base.mseq + k; data.createdAt = now; data.createdBy = vs.createdBy || me; }
    batch.set(rref, data, { merge: true });
    const pref = doc(db, 'payments', rid);
    if (s.paid) batch.set(pref, { recordId: rid, visitId, date: paidDate, amount: c.total, method: s.method, updatedAt: now, createdBy: me }, { merge: true });
    else batch.delete(pref);
  }
  for (const rid of vs.removed){ batch.delete(doc(db, 'records', rid)); batch.delete(doc(db, 'payments', rid)); }
  batch.set(doc(db, 'visits', visitId), {
    ...vis, date: vs.date, time: vs.time, total: r2(total), servicesCount: vs.services.length, updatedAt: now,
    ...(vs.isNew ? { createdAt: now, createdBy: me } : {})
  }, { merge: true });
  audit(vs.isNew ? 'create' : 'update', 'visits', visitId, null, { date: vs.date, patient: name, services: names, total: r2(total) });
  batch.commit().catch(e => toast('e', 'Не вдалося зберегти візит', e.code || ''));
  toast('ok', vs.isNew ? 'Візит збережено' : 'Зміни збережено', '');
  return null;
}

/* ───── Журнал ───── */
const jr = { loaded: { t: 'today' }, pp: null, confirmedFor: null, rows: [], unsub: null, err: null, ready: false };
/* опівночі «Сьогодні» переходить на нову добу без перемикання вкладок */
setInterval(() => {
  if (!profile || jr.loaded.t !== 'today' || !jr.unsub || jr.subDay === todayISO()) return;
  jrSubscribe(); jrPanel(); jrTable();
  if ($('jBody')) toast('i', 'Настала нова доба', 'Журнал показує сьогоднішній день. Попередній — через «Обрати день».');
}, 20000);
function jrStop(){ if (jr.unsub){ jr.unsub(); jr.unsub = null; } }
const ppMonthDate = (off) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + off); return d; };
const ppRange = (off) => { const d = ppMonthDate(off), y = d.getFullYear(), m = d.getMonth(); return `01.${p2(m + 1)}.${y} – ${new Date(y, m + 1, 0).getDate()}.${p2(m + 1)}.${y}`; };
function jrBounds(){
  const L = jr.loaded;
  if (L.t === 'today') return [todayISO(), todayISO()];
  if (L.t === 'day') return [L.iso, L.iso];
  const d = ppMonthDate(L.off), y = d.getFullYear(), m = d.getMonth();
  return [`${y}-${p2(m + 1)}-01`, `${y}-${p2(m + 1)}-${p2(new Date(y, m + 1, 0).getDate())}`];
}
function jrSubscribe(){
  jrStop(); jr.ready = false; jr.err = null; jr.rows = []; jr.subDay = todayISO();
  const [a, b] = jrBounds();
  jr.unsub = onSnapshot(query(collection(db, 'records'), where('date', '>=', a), where('date', '<=', b)),
    (snap) => { jr.rows = snap.docs.map(d => ({ id: d.id, ...d.data() })); jr.ready = true; jr.err = null; jrTable(); },
    (e) => { jr.err = e.code || 'error'; jr.ready = true; jrTable(); });
}

/* швидка зміна оплати з журналу: та сама логіка, що у формі (запис послуги + payments) */
function setPaid(r, paid, method){
  const now = serverTimestamp(), paidDate = paid ? (r.paidDate || todayISO()) : null, b = writeBatch(db);
  b.set(doc(db, 'records', r.id), { paid, paymentMethod: method || null, paidDate, updatedAt: now }, { merge: true });
  if (paid) b.set(doc(db, 'payments', r.id), { recordId: r.id, visitId: r.visitId, date: paidDate, amount: r.totalAmount, method, updatedAt: now, createdBy: profile.id }, { merge: true });
  else b.delete(doc(db, 'payments', r.id));
  audit('update', 'records', r.id, { paid: !!r.paid, paymentMethod: r.paymentMethod || null }, { paid, paymentMethod: method || null });
  b.commit().catch(e => toast('e', 'Не вдалося змінити оплату', e.code || ''));
}
/* відмітка «описано»: лікар — лише своїх (де він «Лікар (описує)»), Керівник/Адмін — будь-яких */

  const r = [...jr.rows, ...Object.values(pt.data).flatMap(d => d.rows)].find(x => x.id === id);
  if (!r || !canDescribeRec(r)) return;
  const v = !r.described;
  const b = writeBatch(db);
  b.set(doc(db, 'records', id), { described: v, updatedAt: serverTimestamp() }, { merge: true });
  audit('update', 'records', id, { described: !!r.described }, { described: v });
  b.commit().catch(e => toast('e', 'Не вдалося змінити відмітку', e.code || ''));
}
function togglePay(id){
  const r = [...jr.rows, ...Object.values(pt.data).flatMap(d => d.rows)].find(x => x.id === id);
  if (!r || !canEditVisit(r)) return;
  if (r.paid) return confirmWin({ type: 'w', title: `Зняти оплату з послуги № ${r.sequentialNumber}?`, details: 'Послугу буде позначено «не оплачено», запис про оплату видалиться.', action: 'Зняти оплату', onOk: () => setPaid(r, false, r.paymentMethod) });
  if (r.paymentMethod) return setPaid(r, true, r.paymentMethod);
  pickWin('Форма оплати', [{ id: 'cashless', label: 'Безготівкова' }, { id: 'cash', label: 'Готівкова' }], '', (m) => setPaid(r, true, m));
}

function jrTable(){

const pt = { q: '', res: null, data: {}, subs: [], msg: null, tooMany: false };
function ptStop(){ pt.subs.forEach(u => u()); pt.subs = []; }
function renderPatients(){
  if (!can('jView')){ $('sheet').innerHTML = noAccessBox('Перегляд даних вам не дозволено.'); return; }
  sheetRerender = ptDraw;
  $('sheet').innerHTML = `<div class="srch-lbl">Пошук пацієнта</div>
    <form class="srch" id="ptForm"><div class="srch-f"><input id="ptQ" autocomplete="off" placeholder="Прізвище (початок ПІБ) або телефон"><button type="button" class="srch-clear" id="ptClr">✕</button></div><button type="submit">🔍 Пошук</button></form>
    <div id="ptRes"></div>`;
  $('ptForm').onsubmit = (e) => { e.preventDefault(); ptSearch(); };
  $('ptClr').onclick = () => { $('ptQ').value = ''; $('ptQ').focus(); };
  $('ptRes').onclick = (e) => {
    const p = e.target.closest('[data-vid]'), y = e.target.closest('[data-pay]'), d = e.target.closest('[data-desc]');
    if (p && !p.classList.contains('off')) openVisitForm(p.dataset.vid);

    if (d) toggleDescribed(d.dataset.desc);
  };
  ptDraw(); $('ptQ').focus();
  $('ptQ').value = pt.q;   // результати й підписки збережені — вкладка показує те, що було
}
async function ptSearch(){
  const raw = $('ptQ').value.trim(), q = raw.toLowerCase();
  ptStop(); pt.data = {}; pt.msg = null; pt.q = raw;
  if (q.length < 2){ pt.res = null; pt.msg = { k: 'i', t: 'Введіть щонайменше 2 символи прізвища.' }; return ptDraw(); }
  try {
    const isPhone = /^[\d\s+()\-]+$/.test(raw), dg = raw.replace(/\D/g, ''), E = String.fromCharCode(0xf8ff);
    let docs;
    if (isPhone){
      if (dg.length < 3){ pt.res = null; pt.msg = { k: 'i', t: 'Для пошуку за телефоном введіть щонайменше 3 цифри.' }; return ptDraw(); }
      const rv = dg.split('').reverse().join('');
      const [a, b2] = await Promise.all([['phoneDigits', dg], ['phoneRev', rv]].map(([f, v]) => getDocs(query(collection(db, 'patients'), where(f, '>=', v), where(f, '<=', v + E), limit(11)))));
      docs = [...a.docs, ...b2.docs.filter(d => !a.docs.some(x => x.id === d.id))];   // початок номера або його кінець
    } else docs = (await getDocs(query(collection(db, 'patients'), where('nameLower', '>=', q), where('nameLower', '<=', q + E), limit(11)))).docs;
    let list = docs.map(d => ({ id: d.id, ...d.data() }));
    pt.tooMany = list.length > 10; list = list.slice(0, 10);
    pt.res = list.sort((a, b) => String(a.name).localeCompare(String(b.name), 'uk'));
  } catch (e){ pt.res = null; pt.msg = { k: 'e', t: 'Не вдалося виконати пошук. ' + (e.code || '') }; return ptDraw(); }
  for (const p of pt.res){
    pt.data[p.id] = { p, rows: [] };
    pt.subs.push(onSnapshot(doc(db, 'patients', p.id), (s) => { if (s.exists()){ pt.data[p.id].p = { id: p.id, ...s.data() }; ptDraw(); } }, () => {}));
    pt.subs.push(onSnapshot(query(collection(db, 'records'), where('patientId', '==', p.id)), (s) => { pt.data[p.id].rows = s.docs.map(d => ({ id: d.id, ...d.data() })); ptDraw(); }, () => {}));
  }
  ptDraw();
}

        <div class="mode-opt" data-mode="doba"><span class="mode-radio"></span><span class="mode-txt"><b>Цілодобово (Доба)</b><span>Заклад фактично працює або чергує цілодобово, незалежно від вказаного графіку.</span></span></div>
      </div>
      <p class="hint" style="margin-top:14px"><b>Вікна типів</b> — підказка взята з понеділка (крок 2), але тут їх видно й можна виправити напряму:</p>
      <table class="shifts">
        <tr><th>Тип</th><th>Вікно</th></tr>
        <tr><td><span class="sh sd">Д</span>Денна</td><td><input type="time" id="winDayFrom" class="win-in"> – <input type="time" id="winDayTo" class="win-in"></td></tr>
        <tr><td><span class="sh sn">Н</span>Нічна</td><td id="winNight" class="dim">не застосовується</td></tr>
        <tr><td><span class="sh s24">Доба</span>Добова</td><td id="winDoba" class="dim">не застосовується</td></tr>
      </table>
      <div class="al al-w flat"><span class="al-icon"><span>!</span></span><div>Обраний тут режим — лише <b>типовий шаблон</b>. Розрахунок кількості змін у звітах спирається на <b>особистий графік кожного працівника</b>, не напряму на цей вибір.</div></div>
      <div class="al al-w flat"><span class="al-icon"><span>!</span></span><div>Якщо графік закладу <b>відрізняється по днях</b>, обчислене вікно бере понеділок; розбіжності для окремих днів виправляються вручну в картці працівника.</div></div>
    </div></div></div>

    <div class="wcard" data-step="4"><div class="st">
      <b>Інші кроки першого пуску</b>
      <div class="placeholder">Тут накопичуватимуться решта дій першого запуску (працівники, послуги, пільги, установи) — у міру опрацювання.</div>
    </div></div>

    <div class="step-f" id="wizFoot"></div>
    <div id="wizErr"></div>`;

  /* телефони */
  const addPhone = (num = '', name = '') => {
    const row = document.createElement('div'); row.className = 'ph-row';
    row.innerHTML = `<input class="ph-num" placeholder="+380 __ ___ __ __" value="${esc(num)}"><input class="ph-name" placeholder="Назва (напр. Реєстратура)" value="${esc(name)}"><span class="ph-x">✕</span>`;
    row.querySelector('.ph-x').onclick = () => row.remove();
    $('phoneList').appendChild(row);
    return row;
  };
  $('phoneAddBtn').onclick = () => addPhone().querySelector('.ph-num').focus();
  /* вихідні */
  for (const wd of $('week').querySelectorAll('.wd'))
    wd.querySelector('.off').onclick = () => { wd.classList.toggle('closed'); if (wizStep === 3) computeShifts(true); };
  for (const inp of $('week').querySelectorAll('.wt'))
    inp.onchange = () => { if (wizStep === 3 && inp.closest('.wd').dataset.d === '0') computeShifts(true); };
  /* режим зміни */
  for (const o of $('modeOpts').children) o.onclick = () => {
    shiftMode = o.dataset.mode;
    for (const x of $('modeOpts').children) x.classList.toggle('on', x === o);
  };
  $('winDayFrom').onchange = $('winDayTo').onchange = () => { $('winDayFrom').dataset.touched = '1'; windowEdited(); };
  showStep(1);
  show('wizard');
}

function showStep(n){
  wizStep = n;
  for (const c of $('wizard').querySelectorAll('.wcard')) c.hidden = (Number(c.dataset.step) !== n);
  [...$('stepsInd').children].forEach((d, i) => {
    d.className = 'dot-s' + (i + 1 < n ? ' done' : '') + (i + 1 === n ? ' on' : '');
  });
  $('wizFoot').innerHTML = n < 4
    ? `<button class="b2" id="wSkip">Пропустити крок</button><button class="b2 pri" id="wNext">Зберегти й далі</button>`
    : `<button class="b2 pri" id="wFinish">Завершити</button>`;
  if ($('wSkip')) $('wSkip').onclick = () => { wiz['s' + n] = 'skipped'; showStep(n + 1); };
  if ($('wNext')) $('wNext').onclick = () => { collectStep(n); showStep(n + 1); };
  if ($('wFinish')) $('wFinish').onclick = finishWizard;
  if (n === 3) computeShifts(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function collectStep(n){
  if (n === 1){
    wiz.facilityName = $('wName').value.trim();
    wiz.facilityAddress = $('wAddr').value.trim();
    wiz.facilityEmail = $('wMail').value.trim();
    wiz.phones = [...$('phoneList').children].map(r => ({ number: r.querySelector('.ph-num').value.trim(), label: r.querySelector('.ph-name').value.trim() })).filter(p => p.number);
  }
  if (n === 2){
    wiz.schedule = [...$('week').children].map(wd => ({ from: wd.querySelector('[data-k=from]').value, to: wd.querySelector('[data-k=to]').value, off: wd.classList.contains('closed') }));
  }
  if (n === 3){
    wiz.shiftMode = shiftMode;
    wiz.shiftWindows = { dayFrom: $('winDayFrom').value, dayTo: $('winDayTo').value, dobaActive: !!dobaFrom };
  }
  wiz['s' + n] = 'saved';
}

/* Поля Денної зміни: понеділок лише ПІДСТАВЛЯЄ початкове значення, далі — редаговані напряму */
function computeShifts(fromWeek){
  const mon = $('week').children[0];
  const from = mon.querySelector('[data-k=from]').value, to = mon.querySelector('[data-k=to]').value;
  $('modeBoxText').textContent = mon.classList.contains('closed') ? 'Пн — вихідний.' : `Пн ${from}–${to}.`;
  if (!$('winDayFrom').dataset.touched){
    $('winDayFrom').value = from; $('winDayTo').value = to;
  }
  windowEdited(true);
}
function windowEdited(){
  const f = $('winDayFrom').value, t = $('winDayTo').value;
  if (!f || !t) return;
  if (f === t){ dobaFrom = f; $('winDayTo').value = midOf(f); }                     // «від == до» → доба навпіл
  else if (!(dobaFrom && f === dobaFrom && t === midOf(f))) dobaFrom = null;       // інакше — звичайний графік
  const to = $('winDayTo').value;
  $('winNight').textContent = to + ' – ' + f; $('winNight').classList.remove('dim');
  if (dobaFrom){
    $('winDoba').textContent = f + ' – ' + f + ' (наступного дня)'; $('winDoba').classList.remove('dim');
    $('modeBoxConcl').innerHTML = 'Це <b>цілодобовий графік</b> — усі три типи активні, доба поділена навпіл.';
  } else {
    $('winDoba').textContent = 'не застосовується'; $('winDoba').classList.add('dim');
    $('modeBoxConcl').innerHTML = 'Це <b>регулярний графік</b> (не цілодобовий) — рекомендуємо модель вище.';
  }
}

async function finishWizard(){
  const btn = $('wFinish'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  /* пропущені кроки → значення за замовчуванням */
  const data = {
    facilityName: wiz.facilityName ?? '', facilityAddress: wiz.facilityAddress ?? '', facilityEmail: wiz.facilityEmail ?? '', phones: wiz.phones ?? [],
    schedule: wiz.schedule ?? DEFAULT_WEEK.map(d => ({ from: d[0], to: d[1], off: !!d[2] })),
    shiftMode: wiz.shiftMode ?? 'day',
    shiftWindows: wiz.shiftWindows ?? { dayFrom: '08:00', dayTo: '20:00' },
    setupDone: true, updatedAt: serverTimestamp()
  };
  try {
    await setDoc(doc(db, 'settings', 'main'), data, { merge: true });
    settings = { ...(settings || {}), ...data };
    renderShell();
  } catch (e){
    console.error('wizard save:', e);
    btn.disabled = false; btn.textContent = 'Завершити';
    $('wizErr').innerHTML = `<div class="al al-e flat"><span class="al-icon">✕</span><div><b>Не вдалося зберегти</b>Перевірте з'єднання й правила Firestore (${esc(e.code || '')}).</div></div>`;
  }
}
</script>
