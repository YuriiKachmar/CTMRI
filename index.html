<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Облік послуг КТ/МРТ</title>
<style>
  :root{
    /* ТИПОГРАФІКА / ВІДСТУПИ / РАДІУСИ — токени дизайн-системи */
    --t-h1:22px; --t-h2:17px; --t-h3:14px; --t-body:13.5px; --t-sm:12px; --t-cap:9.5px;
    --s1:8px; --s2:16px; --s3:24px; --s4:32px;
    --r8:8px; --r12:12px; --r16:16px; --r20:20px;
    --ink:#1F3A34; --green:#1E6B4F; --btn-main:#5AA187; --soft:#D6EEDD; --red:#C0616B;
    --err:#C0392B; --err-bg:#FBEAE8; --info:#2E6DA4; --info-bg:#E9F1F8; --warn:#8A5A12; --warn-bg:#FBF1DF;
    --bg:#E8ECEF; --muted:#6B7B78; --line:#d0d7e0; --ph:#b3bdc9;
    --dark:#a3b1c6; --lite:#ffffff;
    --up:-3px -3px 8px #FFF, 4px 4px 10px rgba(163,177,180,.45);
    --bump:-5px -5px 10px #FFF, 5px 5px 10px rgba(163,177,180,.5);
    --in:inset 3px 3px 7px rgba(163,177,180,.5), inset -3px -3px 7px #FFF;
    --in-on:inset 4px 4px 9px rgba(140,165,150,.5), inset -4px -4px 9px rgba(255,255,255,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);min-height:100vh}
  [hidden]{display:none!important}

  /* ── Завантаження ── */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
  .spin{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
  .spin.dk{border-color:rgba(30,107,79,.25);border-top-color:var(--green);width:28px;height:28px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Вхід (вікно з 4 режимами) ── */
  #auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
  .card{width:100%;max-width:340px;background:var(--bg);border-radius:22px;box-shadow:var(--up);padding:32px 26px 28px;text-align:center}
  .card.fixed-h{min-height:514px;display:flex;flex-direction:column;justify-content:center}
  .logo{width:64px;height:64px;border-radius:var(--r16);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.5px}
  .logo.lock{font-size:26px}
  .fac{font-size:15px;font-weight:800;margin-bottom:3px}
  .app{font-size:11px;color:var(--muted);margin-bottom:24px}
  .t2{font-size:15px;font-weight:800;margin-bottom:8px}
  .sub2{font-size:var(--t-sm);color:var(--muted);line-height:1.55;margin-bottom:18px}
  .sub2 b{color:var(--ink)}
  .in2{width:100%;padding:14px 16px;border:none;border-radius:var(--r12);background:var(--bg);box-shadow:var(--in);font-size:var(--t-body);font-weight:600;color:var(--ink);margin-bottom:11px;text-align:center;font-family:inherit}
  .in2:focus{outline:none;box-shadow:var(--in-on)}
  .in2.fixed{color:var(--muted);font-weight:500}
  .in2::placeholder{color:var(--ph);font-weight:500}
  .btn2{width:100%;padding:15px;border:none;border-radius:13px;background:var(--btn-main);color:#fff;font-size:var(--t-body);font-weight:800;cursor:pointer;margin-top:8px;letter-spacing:.3px;box-shadow:-3px -3px 7px var(--lite),4px 4px 9px var(--dark);font-family:inherit}
  .btn2:active{box-shadow:inset 3px 3px 7px rgba(30,90,70,.42),inset -2px -2px 6px rgba(255,255,255,.18)}
  .btn2.loading{cursor:not-allowed;display:flex;align-items:center;justify-content:center}
  .btn2.ghost{background:var(--bg);color:var(--muted);box-shadow:var(--bump);margin-top:9px}
  .btn2.ghost:active{box-shadow:var(--in)}
  .link2{display:inline-block;margin-top:16px;font-size:11.5px;color:var(--muted);cursor:pointer}

  /* ── Повідомлення .al (затверджений компонент) ── */
  .al{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:var(--r12);font-size:var(--t-sm);background:var(--bg);box-shadow:var(--up);border:1.5px solid;text-align:left;margin-bottom:18px}
  .al b{display:block;font-size:var(--t-body);font-weight:800;margin-bottom:1px;color:var(--ink)}
  .al-icon{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;margin-top:1px}
  .al-ok{border-color:var(--green);background:#fff}.al-ok .al-icon{background:var(--green)}
  .al-e{border-color:var(--err);background:var(--err-bg)}.al-e .al-icon{background:var(--err)}
  .al-w{border-color:var(--warn);background:var(--warn-bg)}
  .al-w .al-icon{width:19px;height:17px;border-radius:0;background:none;position:relative;margin-top:0}
  .al-w .al-icon::before{content:'';position:absolute;inset:0;background:var(--warn);clip-path:polygon(50% 4%, 4% 96%, 96% 96%);border-radius:3px}
  .al-w .al-icon span{position:relative;z-index:1;margin-top:3px;font-size:9px}
  .al-i{border-color:var(--info);background:var(--info-bg)}.al-i .al-icon{background:var(--info)}
  .al.flat{box-shadow:none;margin:12px 0 0}
  .al.flat b{display:inline;font-size:inherit;margin:0}   /* у майстрі <b> стоїть усередині речення, а не як заголовок */

  /* ── Майстер першого запуску ── */
  #wizard{max-width:820px;margin:0 auto;padding:30px 18px 60px}
  h1{font-size:19px;color:var(--green);margin:0 0 6px}
  .lead{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 22px}
  .wcard{background:var(--bg);border-radius:var(--r20);box-shadow:var(--up);padding:22px 24px;margin-bottom:20px}
  .steps-ind{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
  .dot-s{width:9px;height:9px;border-radius:50%;background:var(--dark);opacity:.4}
  .dot-s.on{background:var(--green);opacity:1;width:22px;border-radius:5px}
  .dot-s.done{background:var(--green);opacity:.6}
  .step{display:flex;gap:16px}
  .n{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--bg);box-shadow:var(--bump);display:flex;align-items:center;justify-content:center;font-size:var(--t-h3);font-weight:800;color:var(--green)}
  .st{flex:1;min-width:0}
  .st>b{display:block;font-size:var(--t-h3);margin-bottom:5px}
  .st>p{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 14px}
  .step-f{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:18px}
  .b2{padding:14px 20px;border:none;border-radius:13px;background:var(--bg);box-shadow:var(--bump);font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit}
  .b2:active{box-shadow:var(--in)}
  .b2.pri{background:var(--btn-main);color:#fff;box-shadow:-3px -3px 7px var(--lite),4px 4px 9px var(--dark)}
  .b2.pri:active{box-shadow:inset 3px 3px 7px rgba(30,90,70,.42),inset -2px -2px 6px rgba(255,255,255,.18)}
  .b2.sm{padding:9px 14px;font-size:var(--t-sm)}
  .fac-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .fac-logo{flex:0 0 auto;width:64px;height:64px;border-radius:var(--r16);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--muted)}
  .fac-name{flex:1;min-width:0}
  .fac-name input{width:100%;padding:13px 14px;border:none;border-radius:11px;background:var(--bg);box-shadow:var(--in);font-size:var(--t-body);font-weight:700;color:var(--ink);font-family:inherit}
  .fac-line{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .fac-lbl{flex:0 0 82px;font-size:10.5px;color:var(--muted)}
  .fac-val{flex:1;font-size:12.5px;font-weight:600;color:var(--ink);background:transparent;border:none;padding:0;font-family:inherit}
  .fac-val:focus{outline:none;color:var(--green)}
  .sub2-t{font-size:var(--t-cap);font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 10px}
  .ph-row{display:flex;gap:8px;margin-bottom:8px}
  .ph-num,.ph-name{padding:11px 12px;border:none;border-radius:10px;background:var(--bg);box-shadow:var(--in);font-size:var(--t-sm);font-weight:600;color:var(--ink);min-width:0;font-family:inherit}
  .ph-num{flex:1.4}.ph-name{flex:1}
  .ph-x{flex:0 0 auto;width:36px;border-radius:9px;background:var(--bg);box-shadow:var(--bump);color:var(--red);font-weight:900;font-size:var(--t-sm);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ph-add-btn{width:100%;padding:11px;border:1.5px dashed var(--dark);border-radius:10px;background:transparent;color:var(--green);font-size:11.5px;font-weight:700;cursor:pointer;margin-bottom:6px;font-family:inherit}
  .ph-add-btn:active{background:var(--soft)}
  .week{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
  .wd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .dn{font-size:10.5px;font-weight:800;color:var(--green)}
  .wt{width:100%;padding:8px 3px;border:none;border-radius:9px;background:var(--bg);box-shadow:var(--bump);color:var(--ink);font-size:11px;font-weight:700;text-align:center;-webkit-appearance:none;min-width:0;font-family:inherit}
  .off{width:100%;text-align:center;padding:7px 3px;border-radius:9px;background:var(--bg);box-shadow:var(--bump);font-size:var(--t-cap);color:var(--muted);cursor:pointer}
  .wd.closed .wt{box-shadow:none;background:transparent;pointer-events:none;color:var(--ph)}
  .wd.closed .off{background:var(--soft);color:var(--green);box-shadow:var(--in-on)}
  .hint{font-size:11px;color:var(--muted);line-height:1.55;margin:0}
  .hint b{color:var(--ink)}
  .mode-box{border-radius:13px;background:var(--bg);box-shadow:var(--in);padding:13px 15px;margin:14px 0;font-size:12.5px}
  .mode-opts{display:flex;flex-direction:column;gap:8px}
  .mode-opt{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-radius:var(--r12);background:var(--bg);box-shadow:var(--bump);cursor:pointer}
  .mode-opt.on{background:var(--soft);box-shadow:var(--in-on)}
  .mode-radio{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--bg);box-shadow:var(--in);margin-top:2px;position:relative}
  .mode-opt.on .mode-radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--green)}
  .mode-txt b{display:block;font-size:12.5px;margin-bottom:2px}
  .mode-txt span{font-size:11px;color:var(--muted);line-height:1.5}
  table.shifts{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
  table.shifts th{text-align:left;padding:8px 10px;font-size:var(--t-cap);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--line)}
  table.shifts td{padding:9px 10px;border-bottom:1px solid var(--line)}
  table.shifts tr:last-child td{border-bottom:none}
  table.shifts td.dim{color:var(--muted);font-style:italic}
  .win-in{border:none;border-radius:var(--r8);background:var(--bg);box-shadow:var(--in);padding:6px 8px;font-size:12.5px;color:var(--ink);font-weight:600;-webkit-appearance:none;font-family:inherit}
  .win-in:focus{outline:none;box-shadow:var(--in-on)}
  .sh{display:inline-block;font-size:9px;font-weight:800;padding:3px 9px;border-radius:var(--r8);min-width:34px;text-align:center;margin-right:6px}
  .sh.sd{background:var(--soft);color:var(--green)}.sh.sn{background:#dbe3ec;color:#3b5878}.sh.s24{background:#f3e3c8;color:#8a6011}
  .placeholder{border-radius:var(--r16);background:var(--bg);box-shadow:var(--in);padding:22px;text-align:center;font-size:var(--t-sm);color:var(--muted);line-height:1.6}

  /* ── Головний екран (main.html): верхній блок + тека ── */
  :root{--tab-off:#E0E5E8;--line:#d0d7e0}
  #app{min-height:100vh;background:var(--bg);padding:20px 18px 40px}
  .wrap{max-width:1760px;margin:0 auto}   /* на широкому моніторі вікно розтягується; на вузькому — звичайна прокрутка */
  .top{display:flex;align-items:center;gap:16px;margin-bottom:14px;padding:4px 6px}
  .top .logo{flex:0 0 auto;width:104px;height:104px;margin:0;align-self:center;border-radius:var(--r16);background:var(--bg);box-shadow:-6px -6px 12px var(--lite),6px 6px 12px var(--dark);font-size:11px;cursor:default}
  .topcol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:center;gap:14px}
  .head .fac{font-size:16px;font-weight:800;color:var(--green);margin:0}
  .me{margin-left:auto;font-size:var(--t-sm);color:var(--muted);text-align:right;line-height:1.35}
  .me b{color:var(--ink)}
  .mrow{display:flex;justify-content:flex-start;gap:10px;flex-wrap:wrap;align-items:center}
  .mbtn{width:80px;padding:12px 0;border:none;border-radius:var(--r12);background:var(--bg);box-shadow:-4px -4px 8px var(--lite),4px 4px 8px var(--dark);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;text-align:center;font-family:inherit}
  .mbtn:active{box-shadow:inset 3px 3px 6px var(--dark),inset -3px -3px 6px var(--lite)}
  .mbtn.ico{width:46px;height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:19px}
  .head-cal{margin-left:auto;padding:11px 18px;border:none;border-radius:var(--r12);background:var(--bg);box-shadow:-4px -4px 8px var(--lite),4px 4px 8px var(--dark);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--green);cursor:pointer;font-family:inherit}
  .head-cal:active{box-shadow:inset 3px 3px 6px var(--dark),inset -3px -3px 6px var(--lite)}
  #netBanner{flex:1;margin:0 8px;padding:6px 12px;font-size:11px}
  #netBanner b{font-size:11.5px}
  .folder{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto auto}
  .tab{padding:16px 12px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;color:var(--muted);background:var(--bg);position:relative;white-space:nowrap}
  .tab.on{color:var(--green);border-radius:16px 16px 0 0;z-index:2;box-shadow:-6px -6px 12px var(--lite),6px 0 10px -5px var(--dark);clip-path:inset(-40px -40px 0 -40px)}
  /* останній язичок активний: він і лист — одне ціле → та сама права тінь, що й у листа, без шва внизу */
  .tab.on:nth-child(5){box-shadow:-6px -6px 12px var(--lite),6px 6px 12px var(--dark);clip-path:polygon(-40px -40px,calc(100% + 60px) -40px,calc(100% + 60px) calc(100% + 60px),100% calc(100% + 60px),100% 100%,-40px 100%)}
  .tab:not(.on){border-radius:16px 16px 0 0;margin:0 5px;background:var(--tab-off);box-shadow:-4px -4px 8px var(--lite),4px 4px 8px var(--dark),0 5px 8px -4px var(--lite)}
  .tab:not(.on):active{box-shadow:inset 3px 3px 6px var(--dark),inset -3px -3px 6px var(--lite)}
  /* крайній праворуч язичок закінчується там, де починається вигин кута листа (16px) — без обриву підсвітки й тіні */
  .tab:nth-child(5):not(.on){margin-right:16px}
  .sheet{grid-column:1 / 6;padding:12px 24px 24px;min-height:520px;background:var(--bg);border-radius:0 16px 16px 16px;position:relative;z-index:1;box-shadow:-6px -6px 12px var(--lite),6px 6px 12px var(--dark)}
  .sheet.tl-round{border-top-left-radius:16px}   /* перший язичок неактивний → лівий кут заокруглений */
  .sheet.tr-flat{border-top-right-radius:0}      /* останній язичок активний → правий кут прямий, лист продовжує язичок */
  @media (max-width:700px){.tab{padding:12px 3px;font-size:10.5px}.tab:not(.on){margin:0 2px}.top .logo{width:64px;height:64px}.sheet{padding:12px 12px 20px}}

  /* ── Модальні вікна довідників ── */
  .ov{position:fixed;inset:0;z-index:40;background:rgba(31,58,52,.38);display:flex;align-items:center;justify-content:center;padding:18px}
  .win{width:100%;background:var(--bg);border-radius:var(--r20);box-shadow:var(--up);overflow:hidden;display:flex;flex-direction:column;max-height:92vh}
  .win-h{display:flex;align-items:center;gap:12px;padding:16px 20px 14px;position:relative;flex:0 0 auto}
  .win-h h4{margin:0;font-size:var(--t-h3);font-weight:800;color:var(--green);line-height:1.2}
  .win-x{position:absolute;right:16px;top:13px;width:28px;height:28px;border:none;border-radius:9px;background:var(--bg);box-shadow:var(--bump);color:var(--muted);font-size:13px;cursor:pointer}
  .win-x:active{box-shadow:var(--in)}
  .win-b{padding:0 20px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
  .win-f{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px 20px;flex:0 0 auto}
  .b{padding:14px 20px;border:none;border-radius:13px;background:var(--bg);box-shadow:var(--bump);font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit}
  .b:active{box-shadow:var(--in)}
  .b.pri{background:var(--btn-main);color:#fff;box-shadow:-3px -3px 7px var(--lite),4px 4px 9px var(--dark)}
  .b.pri:active{box-shadow:inset 3px 3px 7px rgba(30,90,70,.42),inset -2px -2px 6px rgba(255,255,255,.18)}
  .b .plus{font-size:20px;font-weight:900;line-height:1;margin-right:6px}
  .grp-h{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
  .grp-h:first-child{margin-top:0}
  .grp-t{font-size:10px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.5px}
  .grp-add-full{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border:none;border-radius:var(--r12);background:var(--btn-main);box-shadow:-3px -3px 7px var(--lite),4px 4px 9px var(--dark);color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;margin:8px 0 0 auto;font-family:inherit}
  .grp-add-full:active{box-shadow:inset 3px 3px 7px rgba(30,90,70,.42),inset -2px -2px 6px rgba(255,255,255,.18)}
  .grp-add-full .plus{font-size:var(--t-h2);font-weight:900;line-height:1}
  .lst{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px;table-layout:fixed}
  .lst th{background:var(--green);color:#fff;padding:9px 10px;font-size:var(--t-cap);font-weight:700;text-transform:uppercase;letter-spacing:.3px;text-align:center}
  .lst td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top;overflow-wrap:anywhere}
  .lst .l{text-align:left}
  .lst td.nm{text-align:left;font-weight:700}
  .lst td.ds{text-align:left;font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.5}
  .lst tr:last-child td{border-bottom:none}
  .lst tr.inact td{opacity:.45}
  .lst .nw{white-space:nowrap}
  .price{font-variant-numeric:tabular-nums;font-weight:700}
  .pen{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border-radius:var(--r8);background:var(--bg);box-shadow:var(--bump);color:var(--green);cursor:pointer;font-size:var(--t-sm)}
  .pen:active{box-shadow:var(--in)}
  .pill{display:inline-block;font-size:var(--t-cap);font-weight:800;padding:4px 11px;border-radius:9px;background:var(--soft);color:var(--green);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .pill.gray{background:#E4E9EA;color:var(--muted)}
  .free{font-size:11.5px;color:var(--muted);font-style:italic}
  .dot{width:22px;height:22px;border-radius:50%;display:inline-block}
  .row{display:flex;gap:11px;flex-wrap:wrap}
  .f{flex:1 1 190px;min-width:0;margin-bottom:11px}
  .f.sm{flex:0 0 150px}
  .f.full{flex:1 1 100%}

    default: return ['Помилка входу', 'Не вдалося виконати вхід (' + code + ').'];
  }
}

async function doLogin(email, pass){
  if (!email || !pass) return setErr('Помилка входу', 'Введіть e-mail і пароль.');
  const key = email.toLowerCase(), f = fails[key];
  if (f && f.until > Date.now()){
    const m = Math.ceil((f.until - Date.now()) / 60000);
    return setErr('Забагато спроб', `Вхід заблоковано ще на ${m} хв.`);
  }
  setBusy(true, firstRun ? 'Створити й увійти' : 'Увійти');
  try {
    if (firstRun) await bootstrapFirstBoss(email, pass);
    else await signInWithEmailAndPassword(auth, email, pass);
    delete fails[key];
    /* далі працює onAuthStateChanged / bootstrapFirstBoss */
  } catch (e){
    const rec = fails[key] || (fails[key] = { n: 0, until: 0 });
    if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'){
      if (++rec.n >= LIMIT){ rec.until = Date.now() + BLOCK_MS; rec.n = 0; }
    }
    setBusy(false, firstRun ? 'Створити й увійти' : 'Увійти');
    const [t, x] = authErr(e.code || ''); setErr(t, x);
    console.warn('login:', e.code || e);
  }
}

async function doReset(email){
  if (!email) return setErr('Помилка', 'Введіть e-mail.');
  setBusy(true, 'Надіслати лист');
  try { await sendPasswordResetEmail(auth, email); } catch (e){ console.warn('reset:', e.code); }
  /* Режим 4 показується завжди однаково — захист від email enumeration */
  renderAuth('sent', { email });
}

/* Режим 2 «Підтвердження» — для чутливих розділів (Доступи). Повертає Promise<boolean>. */
function confirmPassword(section){
  return new Promise((resolve) => {
    const prev = !$('app').hidden ? 'app' : null;
    const user = auth.currentUser;
    const done = (ok) => { show(prev || 'auth'); resolve(ok); };
    renderAuth('confirm', {
      section, email: user.email, onCancel: () => done(false),
      onSubmit: async (pw) => {
        if (!pw) return setErr('Невірний пароль', 'Введіть пароль.');
        setBusy(true, 'Підтвердити');
        try { await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, pw)); done(true); }
        catch (e){ setBusy(false, 'Підтвердити'); setErr('Невірний пароль', 'Спробуйте ще раз.'); }
      }
    });
  });
}

/* ═══ Перший запуск: перший користувач → Керівник ═══ */
async function bootstrapFirstBoss(email, pass){
  bootstrapping = true;
  let cred = null;
  try {
    cred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;
    const wdoc = { lastName: email.split('@')[0], firstName: '', role: 'Керівник', status: 'active', email, createdAt: serverTimestamp() };
    const sdoc = { facilityName: '', setupDone: false, createdAt: serverTimestamp() };
    const batch = writeBatch(db);
    batch.set(doc(db, 'workers', uid), wdoc);
    batch.set(doc(db, 'settings', 'main'), sdoc);
    await batch.commit();
    profile = { id: uid, ...wdoc };
    settings = { ...sdoc };
    firstRun = false;
    bootstrapping = false;
    enterApp();
  } catch (e){
    /* не лишаємо «осиротілий» акаунт без профілю; пауза поглинає події auth від видалення */
    if (cred) await cred.user.delete().catch(() => {});
    await sleep(150);
    bootstrapping = false;
    throw e;
  }
}

/* ═══ Стан авторизації (architecture_v1, розділ 4) ═══ */
onAuthStateChanged(auth, async (user) => {
  if (bootstrapping) return;
  if (!user){ profile = null; return showLogin(); }
  try {
    const snap = await getDoc(doc(db, 'workers', user.uid));
    if (!snap.exists()){
      pendingErr = ['Помилка входу', 'Профіль працівника не знайдено. Зверніться до керівника.'];
      return await signOut(auth); // onAuthStateChanged(null) перемалює вхід і покаже pendingErr
    }
    profile = { id: user.uid, ...snap.data() };
    if (profile.status === 'inactive' || profile.loginAllowed === false){
      pendingErr = ['Доступ заблоковано', 'Зверніться до керівника.'];
      return await signOut(auth);
    }
    await loadSettings();
    enterApp();
  } catch (e){
    console.error('auth state:', e);
    pendingErr = ['Помилка входу', 'Не вдалося завантажити профіль. Перевірте з\'єднання.'];
    await signOut(auth).catch(() => {});
    if (!auth.currentUser) await showLogin();
  }
});

const COL = { services: 'services_catalog', extras: 'extra_catalog', discounts: 'discounts', labels: 'labels', institutions: 'institutions', itypes: 'institution_types', doctors: 'referring_doctors', workers: 'workers' };
const dir = { services: [], extras: [], discounts: [], labels: [], institutions: [], itypes: [], doctors: [], workers: [] };
/* тимчасово: редагувати довідники може Керівник/Адміністратор; далі — з матриці «Доступи» */
const canEditDirs = () => ['Керівник', 'Адміністратор'].includes(profile?.role);

async function loadDirs(){
  const failed = [];
  await Promise.all(Object.keys(COL).map(async (k) => {
    try {
      const snap = await getDocs(collection(db, COL[k]));
      dir[k] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e){ console.warn('dir', COL[k], e.code); failed.push(COL[k] + (e.code ? ' (' + e.code + ')' : '')); }
  }));
  if (failed.length){ const err = new Error('dirs'); err.failed = failed; throw err; }
}

/* Одноразова міграція: правила Firestore не знають шаблонів ролей, тому в кожного працівника з входом має бути явний повний map perms.
   Виконує лише Керівник (після завантаження довідників); для вже заповнених нічого не пишеться. */
function migratePerms(){
  if (profile?.role !== 'Керівник') return;
  const need = dir.workers.filter(w => w.role !== 'Керівник' && !w.mergedInto && (w.hasAccount ?? !!w.email) && !PERM_KEYS.every(k => w.perms && typeof w.perms[k] === 'boolean'));
  if (!need.length) return;
  const b = writeBatch(db);
  for (const w of need){ const p = normPerms(w.role, w.perms); b.set(doc(db, 'workers', w.id), { perms: p, updatedAt: serverTimestamp() }, { merge: true }); w.perms = p; }
  b.commit().then(() => audit('update', 'workers', '*', null, { migratedPerms: need.length })).catch(e => console.warn('perms migration:', e.code));
}

/* Журнал змін (audit_log): знімок «до/після» без службових полів часу */
const plain = (o) => {
  if (!o) return null;
  const r = {};
  for (const [k, v] of Object.entries(o)) if (!['id', 'createdAt', 'updatedAt', 'createdBy'].includes(k)) r[k] = v ?? null;
  return r;
};
function audit(action, collectionName, documentId, before, after){
  const me = profile || {};
  setDoc(doc(collection(db, 'audit_log')), {
    timestamp: serverTimestamp(), userId: me.id || null,
    userSnapshot: { lastName: me.lastName || '', firstName: me.firstName || '', role: me.role || '' },
    action, collection: collectionName, documentId, before: plain(before), after: plain(after)
  }).catch(e => console.warn('audit:', e.code));
}

/* Збереження: кеш оновлюється одразу (офлайн-запис не чекає сервера), помилку сервера повертаємо через перезавантаження */
function saveEntry(key, id, data){
  const col = COL[key];
  const ref = id ? doc(db, col, id) : doc(collection(db, col));
  const i = dir[key].findIndex(x => x.id === ref.id);
  const before = i >= 0 ? { ...dir[key][i] } : null;
  const local = { ...(before || {}), ...data, id: ref.id };
  if (i >= 0) dir[key][i] = local; else dir[key].push(local);
  const payload = { ...data, updatedAt: serverTimestamp(), ...(before ? {} : { createdAt: serverTimestamp(), createdBy: profile.id }) };
  setDoc(ref, payload, { merge: true })
    .then(() => audit(before ? 'update' : 'create', col, ref.id, before, local))
    .catch(async (e) => {
      toast('e', 'Не вдалося зберегти', e.code || '');
      try { await loadDirs(); } catch (_) {}
      rerenderWins();
    });
  rerenderWins();
  return ref.id;
}

const PALETTE = ['#EC9D95', '#F0C199', '#F5E28C', '#A9DFBF', '#AED2ED', '#C7D0D1', '#D2B4DE', '#A3E4D7', '#F1948A', '#7FB3D5', '#F5B7B1', '#D7BDE2'];
function hueOf(hex){
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (d < 0.08) return 1000;                       // сірі — в кінець
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h *= 60; return h < 0 ? h + 360 : h;
}

/* ═══ СКЕРУВАННЯ (skeruvannia.html): Установи + Лікуючі лікарі ═══ */
const isoToUa = (s) => s ? String(s).split('-').reverse().join('.') : '';
const uaToIso = (s) => {
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(s).trim());
  if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3], dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
};

/* ═══ ПРАЦІВНИКИ (pratsivnyky.html): Графік закладу + Лаборанти/Лікарі + картка ═══ */
const toMin = (s) => { const [h, m] = String(s).split(':'); return (+h) * 60 + (+m); };
const fmtDur = (min) => Math.floor(min / 60) + ' год' + (min % 60 ? ' ' + (min % 60) + ' хв' : '');
/* Тип зміни обчислюється з годин; еталон — shiftWindows з налаштувань (окремо від щоденного графіку закладу), допуск ±60 хв */
function classifyShift(f, t){
  const w = settings?.shiftWindows || {}, dFrom = w.dayFrom || '08:00', dTo = w.dayTo || '20:00', TOL = 60;
  if (f === t) return { cls: 's24', label: 'Доба' };
  const from = toMin(f), dur = (toMin(t) - from + 1440) % 1440;
  const dS = Math.abs(from - toMin(dFrom)), dE = Math.abs(from - toMin(dTo)), dD = Math.abs(dur - 720);
  if (dS <= TOL && dD <= TOL) return { cls: 'sd', label: 'Д' };
  if (dE <= TOL && dD <= TOL) return { cls: 'sn', label: 'Н' };
  const near = dS <= dE ? { ref: `денної (${dFrom})`, diff: dS } : { ref: `нічної (${dTo})`, diff: dE };
  return { cls: 'sx', label: 'Нетиповий', note: `Тривалість ${fmtDur(dur)}. Найближче до ${near.ref} зміни, але початок відхиляється на ${near.diff} хв (допуск — 60 хв)` + (dD > TOL ? `, і тривалість теж поза допуском (${dD} хв від еталонних 12 год)` : '') + '. Позначено «Нетиповий» — перевірте години або залиште як є.' };
}
const currentShift = (w) => { const t = todayISO(); return [...(w.shifts || [])].reverse().find(p => !p.excluded && p.start <= t && (!p.end || p.end >= t)) || null; };
const ST_TEXT = {
  active: 'Працівник працює на роботі: він у списках, змінах і звітах. Чи може він користуватись програмою — визначає панель «Доступ» нижче.',
  inactive: 'Працівник не працює. Вхід у програму заблоковано. Записи, які він вніс раніше, зберігаються у звітах.'
};
const sortWorkers = (a, b) => ((a.status === 'inactive') - (b.status === 'inactive')) || String(a.lastName).localeCompare(String(b.lastName), 'uk') || String(a.firstName).localeCompare(String(b.firstName), 'uk');
const fullName = (w) => [w.lastName, w.firstName, w.middleName].filter(Boolean).join(' ');

const pill2 = (st) => st === 'inactive' ? '<span class="pill gray">не активний</span>' : '<span class="pill">активний</span>';

/* Графік закладу: зберігається одразу при зміні (settings/main.schedule), лише Керівник */
function weekChanged(){
  const wk = [...$('sheet').querySelectorAll('.week .wd')].map(wd => { const [a, b] = wd.querySelectorAll('.wt'); return { from: a.value, to: b.value, off: wd.classList.contains('closed') }; });
  if (wk.some(d => !d.off && (!d.from || !d.to))){ toast('e', 'Некоректний час', 'Вкажіть години для кожного робочого дня.'); return renderStaff(); }
  if (wk.every(d => d.off)){
    confirmWin({ type: 'w', title: 'Усі 7 днів позначено вихідними.', details: 'Заклад не працюватиме взагалі — усі записи в журналі потраплятимуть поза вікном.', action: 'Зберегти все одно', onOk: () => saveWeek(wk), onCancel: renderStaff });
    return;
  }
  saveWeek(wk);
}
async function saveWeek(wk){
  const before = settings?.schedule || null;
  try {
    await setDoc(doc(db, 'settings', 'main'), { schedule: wk, updatedAt: serverTimestamp() }, { merge: true });
    settings = { ...(settings || {}), schedule: wk };
    audit('update', 'settings', 'main', { schedule: before }, { schedule: wk });
  } catch (e){ toast('e', 'Не вдалося зберегти графік закладу', e.code || ''); renderStaff(); }
}

      <div class="stexp">Тип (Д/Н/Доба) обчислюється <b>автоматично</b> з введених годин — не обирається. Еталонні межі (<b>${esc(settings?.shiftWindows?.dayFrom || '08:00')} / ${esc(settings?.shiftWindows?.dayTo || '20:00')}</b>) — окреме налаштування типів змін, <b>не пов'язане</b> з щоденним розкладом закладу. Редагування доступне лише адміністратору.</div></div>
    <div class="sect"><div class="sect-h"><div class="sect-t">Доступ</div></div>
      <div class="row"><div class="f full"><label>Дозволити користуватись програмою</label>
        <div class="seg" data-allow><span data-v="1" class="${allowInit ? 'on' : ''}">Дозволено</span><span data-v="0" class="${allowInit ? '' : 'on'}">Не дозволено</span></div></div></div>
      <div data-login-fields>
        <div class="row" style="align-items:flex-end"><div class="f"><label>E-mail (логін для входу)</label><input class="in" type="email" data-f="email2" autocomplete="off" value="${esc(rec?.email || '')}" ${hasAcc ? 'readonly' : ''}></div>
          ${hasAcc ? '<div class="f" style="align-self:flex-end"><span class="chip-add" data-reset>✉ Надіслати лист для скидання пароля</span></div>'
                   : '<div class="f"><label>Пароль (не менше 6 символів)</label><input class="in" type="password" data-f="pass" autocomplete="new-password"></div>'}</div>
        ${hasAcc ? '<div class="stexp">Пароль працівнику змінюється лише листом для скидання — пряма зміна чужого пароля в безкоштовному режимі недоступна. Після дозволу входу надішліть працівнику цей лист: він сам встановить пароль.</div>' : ''}</div>
      <div class="al al-i" style="margin:6px 0 0"><span class="al-icon">i</span><div><strong>Дозволено</strong> — працівник входить у програму за e-mail і паролем (права доступу — окремо, у розділі «Доступи»). <strong>Не дозволено</strong> — вхід заблоковано, але працівник лишається у списках, змінах і звітах; пароль для цього не потрібен (обліковий запис створюється з випадковим паролем, якого ніхто не знає). Щоб дозволити вхід пізніше, оберіть «Дозволено», збережіть і надішліть працівнику лист для скидання пароля — він сам встановить пароль. Керівник чи адміністратор може будь-коли заблокувати вхід цим перемикачем, а потім знову дозволити. Для нового працівника за замовчуванням вхід не дозволено.</div></div></div>`,
  async (o) => {
    const fio = val(o, 'fio').split(/\s+/).filter(Boolean);
    if (fio.length < 2) return ['Вкажіть прізвище та ім\'я', 'Бажано й по батькові.'];
    const data = { lastName: fio[0], firstName: fio[1], middleName: fio.slice(2).join(' '), role: val(o, 'role'),
      phone: val(o, 'phone'), status: o.querySelector('.seg .on').dataset.v };
    // змінний графік
    const out = [];
    for (const [k, p] of periods.entries()){
      if (!p.from || !p.to) return [`Період ${k + 1}: вкажіть години`, ''];
      if (!p.start) return [`Період ${k + 1}: вкажіть дату початку`, ''];
      if (p.end && p.end < p.start) return [`Період ${k + 1}: «по» раніше за «з»`, 'Виправте дати.'];
      out.push({ from: p.from, to: p.to, start: p.start, end: p.end || null, excluded: !!p.excluded });
    }
    const act = out.filter(p => !p.excluded);
    if (act.filter(p => !p.end).length > 1) return ['Два відкриті періоди одночасно', 'Спершу закрийте попередній (поставте «по» або «Завершене»).'];
    const sorted = [...act].sort((a, b) => a.start.localeCompare(b.start));
    for (let i = 1; i < sorted.length; i++) if (!sorted[i - 1].end || sorted[i].start <= sorted[i - 1].end) return ['Періоди змінного графіку перетинаються', 'Початок нового періоду має бути пізніше за закриття попереднього.'];
    if (data.role === 'Лаборант' || data.role === 'Лікар') data.shifts = out;
    // попередження про зміни «заднім числом»
    const retro = periods.some((p, i) => orig[i] ? (p.start !== orig[i].start || p.from !== orig[i].from || p.to !== orig[i].to || (orig[i].end && p.end !== orig[i].end)) && !p.excluded : p.start < today && !p.excluded);
    if (retro && !o._retroOk){
      const go = await new Promise((res) => confirmWin({ type: 'w', title: 'Зміни в минулому.', details: 'Ви змінюєте дати або години періоду, що вже почався. Це може вплинути на сформовані звіти (місячні можуть перестати сходитись із квартальним).', action: 'Зберегти все одно', onOk: () => res(true), onCancel: () => res(false) }));
      if (!go) return ['Збереження скасовано', 'Перевірте дати змінного графіку.'];
    }
    const allow = o.querySelector('[data-allow] .on').dataset.v === '1';
    const emailIn = val(o, 'email').toLowerCase();
    if (rec && !hasAcc && emailIn && !/^\S+@\S+\.\S+$/.test(emailIn)) return ['Некоректний e-mail', 'Перевірте адресу або залиште поле порожнім.'];
    if (rec && (hasAcc || !allow)){ saveEntry('workers', id, { ...data, ...(hasAcc ? { loginAllowed: allow } : { loginAllowed: false, hasAccount: false, email: emailIn }) }); return null; }
    // потрібен вхід (новий працівник або наявний без входу): створюємо обліковий запис через окремий екземпляр Firebase, щоб не розлогінити адміна
    const email = val(o, 'email').toLowerCase(); let pass = o.querySelector('[data-f="pass"]').value;
    const whom = data.role === 'Лікар' ? 'цього лікаря' : 'цього лаборанта';
    if (!email) return ['Введіть e-mail', `Введіть e-mail, щоб додати (зберегти) ${whom} до бази даних. Він стане логіном, навіть якщо вхід у програму поки не дозволено.`];
    if (!/^\S+@\S+\.\S+$/.test(email)) return ['Некоректний e-mail', 'Перевірте адресу — вона буде логіном працівника.'];
    if (allow && !pass) return ['Введіть пароль', `Без пароля неможливо дозволити вхід для ${whom}. Не менше 6 символів.`];
    if (allow && pass.length < 6) return ['Занадто короткий пароль', 'Не менше 6 символів.'];
    if (!allow) pass = Array.from(crypto.getRandomValues(new Uint8Array(18)), (x) => x.toString(36).padStart(2, '0')).join('');   // випадковий пароль, якого не знає ніхто: вхід заблоковано, працівник пізніше сам встановить пароль листом
    if (dir.workers.some(w => !w.mergedInto && (w.hasAccount ?? !!w.email) && String(w.email).toLowerCase() === email)) return ['Такий e-mail уже є', 'Працівника з цим e-mail уже додано.'];
    const secApp = initializeApp(firebaseConfig, 'sec' + Date.now());
    let cred = null;
    try {
      const secAuth = initializeAuth(secApp, { persistence: inMemoryPersistence });
      cred = await createUserWithEmailAndPassword(secAuth, email, pass);
      const wdoc = { ...data, perms: normPerms(data.role, rec?.perms), email, loginAllowed: allow, hasAccount: true, createdBy: profile.id, ...(rec ? { legacyId: id } : {}) };
      await setDoc(doc(db, 'workers', cred.user.uid), { ...wdoc, createdAt: serverTimestamp() });
      dir.workers.push({ id: cred.user.uid, ...wdoc });
      audit('create', 'workers', cred.user.uid, null, { id: cred.user.uid, ...wdoc });
      // id працівника з входом має дорівнювати uid акаунта (правила Firestore), тому стару картку без входу «зливаємо» в нову
      if (rec) saveEntry('workers', id, { mergedInto: cred.user.uid, status: 'inactive', loginAllowed: false });
      await signOut(secAuth).catch(() => {});
      rerenderWins();
      return null;
    } catch (e){
      if (cred) await cred.user.delete().catch(() => {});   // не лишаємо акаунт без профілю
      if (e.code === 'auth/email-already-in-use') return ['Такий e-mail уже зареєстровано', 'Використайте інший e-mail.'];
      if (e.code === 'auth/invalid-email') return ['Некоректний e-mail', ''];
      if (e.code === 'auth/weak-password') return ['Занадто слабкий пароль', 'Оберіть складніший.'];
      return ['Не вдалося створити працівника', e.code || e.message || ''];
    } finally { deleteApp(secApp).catch(() => {}); }
  }, 680);

  const per = ov.querySelector('[data-per]');
  const draw = () => { per.innerHTML = periods.length ? periods.map(shRow).join('') : '<div class="al al-i" style="margin:0 0 8px"><span class="al-icon">i</span><div><b>Робочого часу ще не задано</b>Додайте перший період — і працівник з\'явиться в зміні.</div></div>'; };
  draw();
  const syncRole = () => { ov.querySelector('[data-sched]').hidden = !['Лаборант', 'Лікар'].includes(val(ov, 'role')); };
  ov.querySelector('[data-f="role"]').onchange = syncRole; syncRole();
  const e1 = ov.querySelector('[data-f="email"]'), e2 = ov.querySelector('[data-f="email2"]');
  e1.addEventListener('input', () => { e2.value = e1.value; }); e2.addEventListener('input', () => { e1.value = e2.value; });   // e-mail дублюється в «Даних» і в «Доступі»
  const lf = ov.querySelector('[data-login-fields]'), allowSeg = ov.querySelector('[data-allow]');
  const syncAllow = () => { lf.hidden = allowSeg.querySelector('.on').dataset.v !== '1'; };
  syncAllow();
  ov.addEventListener('click', (e) => {
    const sg = e.target.closest('.seg span');
    if (!sg) return;
    if (sg.closest('[data-allow]')) syncAllow();
    else ov.querySelector('[data-stexp]').textContent = ST_TEXT[sg.dataset.v] || '';
  });

  ov.querySelector('[data-reset]')?.addEventListener('click', async () => {
    try { await sendPasswordResetEmail(auth, rec.email); toast('ok', 'Лист надіслано', 'Працівник отримає посилання для нового пароля на ' + rec.email); }
    catch (e){ toast('e', 'Не вдалося надіслати лист', e.code || ''); }
  });
  per.addEventListener('input', (e) => { const i = e.target.dataset.pi; if (i != null) periods[i][e.target.dataset.pf] = e.target.value; });
  per.addEventListener('change', (e) => {
    const i = e.target.dataset.pi; if (i == null) return;
    const row = per.querySelector(`[data-row="${i}"]`), p = periods[i], f = e.target.dataset.pf, tpl = document.createElement('div');
    if (f === 'from' || f === 'to'){
      const r = classifyShift(p.from, p.to), bd = row.querySelector('[data-bd]');
      bd.className = 'sh-badge ' + r.cls; bd.textContent = r.label;
      row.querySelector('[data-nt]').innerHTML = noteHtml({ ...p, note: null }, r);
    }
    if (f === 'end'){ tpl.innerHTML = stCtl(p, i); row.querySelector('[data-stc]').replaceWith(tpl.firstElementChild); }
  });
  per.addEventListener('click', (e) => {
    const end = e.target.closest('[data-pend]'), del = e.target.closest('[data-pdel]');
    if (end){
      const p = periods[end.dataset.pend];
      if (!p.end) p.end = todayISO();
      p.note = { t: 'i', x: 'Робочий час позначено завершеним із сьогоднішньою датою «по».' }; draw();
    }
    if (del){
      const p = periods[del.dataset.pdel], n = visitsInPeriod(p);
      confirmWin({ type: n > 0 ? 'e' : 'w', title: 'Ви виключаєте цей робочий час з обліку.',
        details: `${isoToUa(p.start)} – ${p.end ? isoToUa(p.end) : 'донині'}. ` + (n > 0 ? `На нього спирається ${n} записів у журналі.` : 'Записів на цьому періоді немає.'),
        action: 'Видалити з обліку',
        onOk: () => { p.excluded = true; p.note = n > 0 ? { t: 'w', x: `Виключено з обліку — ${n} записів більше не враховуються в розрахунку зміни.` } : { t: 'i', x: 'Виключено з обліку — записів на цьому періоді не було.' }; draw(); } });
    }
  });
  ov.querySelector('[data-padd]').addEventListener('click', () => {
    const last = periods[periods.length - 1];
    if (last && !last.excluded){
      if (!last.end){ last.end = today; last.note = { t: 'i', x: 'Автоматично позначено завершеним при додаванні нового робочого часу.' }; }
      else if (today <= last.end){ last.note = { t: 'w', x: 'Новий період не може починатися раніше за закриття попереднього — він завершується не раніше сьогодні. Перевірте дати.' }; draw(); return; }
    }
    periods.push({ from: '08:00', to: '20:00', start: today, end: '', excluded: false, note: null }); draw();
    per.lastElementChild?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

/* ═══ КАЛЕНДАР ЧЕРГУВАНЬ (calendar_cherguvan.html) ═══
   duty_days/{РРРР-ММ-ДД} = { date, labs:[workerId], docs:[workerId] } — лише ручні відмітки.
   Лаборанти за днями додатково беруться з візитів журналу (хто вносив записи — той чергував): це «факт», його не прибрати.
   Піктограму зміни (Д/Н/Доба) не зберігаємо — беремо зі змінного графіку працівника на цю дату. */
const canEditCal = () => ['Керівник', 'Адміністратор', 'Лаборант'].includes(profile?.role);
const shiftOn = (w, iso) => [...(w?.shifts || [])].reverse().find(p => !p.excluded && p.start <= iso && (!p.end || p.end >= iso)) || null;
const wNorm = (id) => { const w = workerBy(id); return w?.mergedInto || w?.id || id; };
const cal = { y: 0, m: 0, onLeft: false, unsub: null, duty: {}, vis: [], ov: null, seq: 0 };
const calBadge = (wid, iso) => {
  const p = shiftOn(workerBy(wid), iso); if (!p) return '';
  const r = classifyShift(p.from, p.to);
  return `<span class="sh-badge ${r.cls}" title="${esc(p.from)}–${esc(p.to)}">${r.cls === 'sx' ? '?' : esc(r.label)}</span>`;
};
function calData(){
  const days = new Date(cal.y, cal.m + 1, 0).getDate(), td = todayISO(), ym = `${cal.y}-${p2(cal.m + 1)}`;
  const labHas = {}, docHas = {};
  for (const v of cal.vis){
    (labHas[v.date] ||= new Set()).add(wNorm(v.labTechId));
    if (v.describerId) (docHas[v.date] ||= new Set()).add(wNorm(v.describerId));
  }
  const out = [], sums = { lab: new Map(), doc: new Map() }, nod = [];
  for (let d = 1; d <= days; d++){
    const iso = `${ym}-${p2(d)}`, duty = cal.duty[iso] || {};
    const mk = (g) => {
      const ex = (g === 'lab' ? duty.labs : duty.docs) || [], has = (g === 'lab' ? labHas : docHas)[iso] || new Set();
      const items = ex.map(wid => ({ wid, der: false, nodata: iso < td && !has.has(wNorm(wid)) }));
      if (g === 'lab') for (const wid of has) if (wid && !ex.some(x => wNorm(x) === wid)) items.push({ wid, der: true, nodata: false });
      for (const it of items){
        const s = sums[g].get(it.wid) || { worked: 0, planned: 0 }; if (iso < td) s.worked++; else s.planned++; sums[g].set(it.wid, s);
        if (it.nodata) nod.push({ iso, wid: it.wid, g });
      }
      return items;
    };
    out.push({ d, iso, wd: (new Date(cal.y, cal.m, d).getDay() + 6) % 7, labs: mk('lab'), docs: mk('doc') });
  }
  return { out, sums, nod };
}
function calDraw(){
  const ov = cal.ov; if (!ov || !ov.isConnected) return;
  const M = (a, b) => `<span class="pp-m">${a}</span><span class="pp-d">${b}</span>`, now = new Date(), isCur = cal.y === now.getFullYear() && cal.m === now.getMonth();
  const mon = `${MON_NAME[cal.m]}`, rng = `01.${p2(cal.m + 1)}.${cal.y} – ${new Date(cal.y, cal.m + 1, 0).getDate()}.${p2(cal.m + 1)}.${cal.y}`;
  ppSet('cl', cal.onLeft
    ? { L: { on: true, h: M(mon, rng) }, M: { h: M('Наступний місяць', 'вперед →') }, R: { h: M('Обрати місяць', 'будь-який') } }
    : { L: { h: M('Попередній місяць', '← назад') }, M: { on: true, h: M(mon, rng) }, R: { h: M('Обрати місяць', 'будь-який') } });
  const { out, sums, nod } = calData(), sched = settings?.schedule || [], td = todayISO(), ed = canEditCal();
  const lead = (new Date(cal.y, cal.m, 1).getDay() + 6) % 7;
  const nm = (wid) => { const w = workerBy(wid); return w ? shortName(w) : '(видалений працівник)'; };
  const chip = (it, g, iso) => `<div class="slot fl${it.nodata ? ' nodata' : ''}${it.der ? ' der' : ''}" data-g="${g}" data-wid="${esc(it.wid)}" data-der="${it.der ? 1 : 0}" title="${esc(nm(it.wid))}${it.der ? ' — вносив записи в журнал' : it.nodata ? ' — чергував, але записів немає' : ''}">${calBadge(it.wid, iso)}<span>${esc(workerBy(it.wid)?.lastName || '—')}</span></div>`;
  let h = '<div class="cell out"></div>'.repeat(lead);
  for (const c of out){
    h += `<div class="cell${c.iso < td ? ' past' : ''}${c.iso === td ? ' today' : ''}${sched[c.wd]?.off ? ' rest' : ''}" data-iso="${c.iso}">
      <div class="grp lab">${c.labs.map(i => chip(i, 'lab', c.iso)).join('')}${ed && c.iso >= td ? '<div class="slot add" data-g="lab" title="Додати лаборанта">+</div>' : ''}</div>
      <div class="dnum">${c.d}</div>
      <div class="grp doc">${c.docs.map(i => chip(i, 'doc', c.iso)).join('')}${ed && c.iso >= td ? '<div class="slot add" data-g="doc" title="Додати лікаря">+</div>' : ''}</div></div>`;
  }
  ov.querySelector('[data-cg]').innerHTML = h;
  const sumTbl = (g, title) => {
    const rows = [...sums[g]].map(([wid, s]) => ({ wid, ...s })).sort((a, b) => nm(a.wid).localeCompare(nm(b.wid), 'uk'));
    return `<div class="cal-sum"><div class="cal-sh"><span>${title}</span><span>відпрац.</span><span>+план</span></div>` + (rows.length
      ? rows.map(r => `<div class="cal-sr"><span>${calBadge(r.wid, td)}${esc(nm(r.wid))}</span><b>${r.worked}</b><span class="pl">+${r.planned}</span></div>`).join('')
      : '<div class="cal-sr"><span class="mut">У цьому місяці чергувань немає</span><b></b><span></span></div>') + '</div>';
  };
  const dm = (iso) => iso.slice(8) + '.' + iso.slice(5, 7);
  ov.querySelector('[data-cs]').innerHTML = `<div class="cal-sums">${sumTbl('lab', 'Лаборанти')}${sumTbl('doc', 'Лікарі')}</div>
    <div class="cal-leg"><span><i class="lg-b"></i>над датою — лаборанти, під датою — лікарі</span><span>відпрац. = дні до сьогодні, +план = сьогодні й далі (в оплату йде лише перше число)</span><span><i class="lg-n"></i>чергування є, записів немає</span><span><i class="lg-r"></i>заклад не працює за графіком (вносити можна)</span></div>`
    + (nod.length ? `<div class="al al-w" style="margin:10px 0 0"><span class="al-icon"><span>!</span></span><div><b>${nod.length} ${nod.length === 1 ? 'день відмічено' : 'дн. відмічено'} як чергування, але записів у журналі немає</b>(${nod.map(n => `${dm(n.iso)} — ${esc(workerBy(n.wid)?.lastName || '—')}`).join(', ')}). Імовірно, не було пацієнтів. Ці дні <b>не входять у підсумок звіту</b>, але виносяться в примітку — рішення про оплату ухвалює адміністратор.</div></div>` : '');
}
async function calLoad(){
  const my = ++cal.seq, a = `${cal.y}-${p2(cal.m + 1)}-01`, b = `${cal.y}-${p2(cal.m + 1)}-${p2(new Date(cal.y, cal.m + 1, 0).getDate())}`;
  if (cal.unsub){ cal.unsub(); cal.unsub = null; }
  cal.duty = {}; cal.vis = []; calDraw();
  cal.unsub = onSnapshot(query(collection(db, 'duty_days'), where('date', '>=', a), where('date', '<=', b)),
    (snap) => { if (my !== cal.seq) return; cal.duty = {}; snap.docs.forEach(d => { cal.duty[d.id] = d.data(); }); calDraw(); },
    (e) => { console.warn('duty:', e.code); });
  try {   // хто вносив записи в журнал цього місяця (візитів значно менше, ніж послуг)
    const snap = await getDocs(query(collection(db, 'visits'), where('date', '>=', a), where('date', '<=', b)));
    if (my !== cal.seq) return;
    cal.vis = snap.docs.map(d => d.data()); calDraw();

async function rpLoad(){

/* ── обчислення: «По лаборантах» (алгоритм вікон змін із alhorytm_cherguvan) ── */
const TP_NAME = { 'Д': 'денна', 'Н': 'нічна', 'Доба': 'добова' };
const tpCls = (l) => ({ 'Д': 'sd', 'Н': 'sn', 'Доба': 's24' }[l] || 'sx');
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return iso2(d.getFullYear(), d.getMonth(), d.getDate()); };
const newAgg = () => ({ n: 0, base: 0, after: 0, exN: 0, exSum: 0, cashless: 0, cash: 0 });
function addAgg(g, r){
  g.n++; g.base += Number(r.servicePrice) || 0; g.after += Number(r.servicePriceAfterDiscount) || 0;
  g.exN += (r.extras || []).length; g.exSum += Number(r.extrasTotal) || 0;
  if (r.paid && r.paymentMethod === 'cashless') g.cashless += Number(r.totalAmount) || 0;
  if (r.paid && r.paymentMethod === 'cash') g.cash += Number(r.totalAmount) || 0;
}
const sumAgg = (list) => list.reduce((s, g) => { for (const k of Object.keys(s)) s[k] += g[k]; return s; }, newAgg());
function labReport(data, filterLab){
  const sw = settings?.shiftWindows || {}, dF = toMin(sw.dayFrom || '08:00'), dT = toMin(sw.dayTo || '20:00'), td = todayISO();
  const labs = new Map();
  for (const r of data.recs){
    const wid = wNorm(r.labTechId || '');
    if (filterLab && wid !== filterLab) continue;
    const L = labs.get(wid) || { wid, shifts: new Map(), nosch: 0, outs: [] }; labs.set(wid, L);
    const per = shiftOn(workerBy(wid), r.date);
    let tp = '—', sd = r.date, out = false, schName = '';
    if (per){
      tp = classifyShift(per.from, per.to).label; schName = `${per.from}–${per.to}`;
      const f = toMin(per.from), to = toMin(per.to), t = toMin(r.time || '00:00');
      if (f >= to){ if (t >= f) sd = r.date; else if (t < to) sd = addDays(r.date, -1); else out = true; }   // вікно через північ (нічна, доба)
      else if (!(t >= f && t < to)) out = true;
    } else L.nosch++;
    const key = sd + '|' + tp;
    const g = L.shifts.get(key) || { sd, tp, dates: new Map(), out: 0 }; L.shifts.set(key, g);
    const dg = g.dates.get(r.date) || newAgg(); g.dates.set(r.date, dg); addAgg(dg, r);
    if (out){ g.out++; const t = toMin(r.time || '00:00'); L.outs.push({ date: r.date, inDay: t >= dF && t < dT, sch: `${TP_NAME[tp] || 'нетипова'} ${schName}` }); }
  }
  const list = [...labs.values()].map(L => {
    const shifts = [...L.shifts.values()].sort((a, b) => a.sd.localeCompare(b.sd) || a.tp.localeCompare(b.tp));
    const tot = sumAgg(shifts.flatMap(s => [...s.dates.values()]));
    const types = {}; shifts.forEach(s => { types[s.tp] = (types[s.tp] || 0) + 1; });
    const first = shifts.length ? [...shifts[0].dates.keys()].sort()[0] : '9999';
    return { ...L, shifts, tot, types, first, count: shifts.length };
  }).sort((a, b) => a.first.localeCompare(b.first) || nameOfW(a.wid).localeCompare(nameOfW(b.wid), 'uk'));
  /* дні з календаря без записів (лише минулі) */
  const nod = [];
  for (const [iso, d] of Object.entries(data.duty)){
    if (iso >= td) continue;
    for (const wid of (d.labs || [])){
      const nw = wNorm(wid); if (filterLab && nw !== filterLab) continue;
      if (!data.recs.some(r => r.date === iso && wNorm(r.labTechId || '') === nw)) nod.push({ iso, wid: nw });
    }
  }
  nod.sort((a, b) => a.iso.localeCompare(b.iso));
  return { list, nod };
}
const nameOfW = (wid) => { const w = workerBy(wid); return w ? shortName(w) : '(видалений працівник)'; };
function labSchedText(wid, a, b){
  const ps = [...(workerBy(wid)?.shifts || [])].filter(p => !p.excluded && p.start <= b && (!p.end || p.end >= a)).sort((x, y) => x.start.localeCompare(y.start));
  if (!ps.length) return 'графік не заданий';
  const nm = (p) => TP_NAME[classifyShift(p.from, p.to).label] || 'нетипова';
  if (ps.length === 1) return `${nm(ps[0])} ${ps[0].from}–${ps[0].to}`;
  return ps.map((p, i) => i ? `${nm(p)} (з ${p.start.slice(8)}.${p.start.slice(5, 7)})` : nm(p)).join(' → ');
}
const tpChips = (types) => Object.entries(types).sort((a, b) => a[0].localeCompare(b[0], 'uk')).map(([t, n]) => `<span class="sh ${tpCls(t)}">${esc(t)}</span> ${n}`).join(' ');
const plN = (n, f) => { const a = n % 10, b = n % 100; return n + ' ' + (a === 1 && b !== 11 ? f[0] : (a >= 2 && a <= 4 && (b < 12 || b > 14) ? f[1] : f[2])); };
const dmy = (iso) => iso.slice(8) + '.' + iso.slice(5, 7);

function rpNotes(rep, a, b){
  const notes = [];
  for (const L of rep.list){
    if (L.outs.length){
      const ds = L.outs.map(o => o.date).sort(), win = L.outs.some(o => o.inDay) && L.outs.some(o => !o.inDay) ? 'іншої зміни' : (L.outs[0].inDay ? 'денної зміни' : 'нічної зміни');
      notes.push({ wid: L.wid, crit: true, h: `${nameOfW(L.wid)}, ${dmy(ds[0])}${ds[ds.length - 1] !== ds[0] ? '–' + dmy(ds[ds.length - 1]) : ''}:`, t: `графік ${L.outs[0].sch}, але ${plN(L.outs.length, ['запис', 'записи', 'записів'])} зроблено поза його вікном — у вікні ${win}. Причину визначає адміністратор. Понаднормові система не нараховує.` });
    }
    const ps = (workerBy(L.wid)?.shifts || []).filter(p => !p.excluded && p.start > a && p.start <= b);
    if (ps.length) notes.push({ wid: L.wid, crit: false, h: `${nameOfW(L.wid)}:`, t: `графік змінено ${dmy(ps[0].start)} (${labSchedText(L.wid, a, b)}). Зміни пораховані окремо: ${Object.entries(L.types).map(([t, n]) => t + ' ' + n).join(', ')}.` });
    if (L.nosch) notes.push({ wid: L.wid, crit: false, h: `${nameOfW(L.wid)}:`, t: `на дату ${plN(L.nosch, ['запису', 'записів', 'записів'])} графік не заданий — зміну визначено за календарною датою (тип «—»).` });
  }
  if (rep.nod.length) notes.push({ crit: true, h: 'Чергування без записів у журналі', t: `(з календаря): ${rep.nod.map(n => `${esc(nameOfW(n.wid))} — ${dmy(n.iso)}`).join(' · ')}. Імовірно, не було пацієнтів. Ці дні не входять у підсумок змін вище — рішення про оплату ухвалює адміністратор.` });
  return notes;
}

    + (pay ? '<th class="r">Безготівка</th><th class="r">Готівка</th>' : '') + '</tr></thead>';

/* ═══ ЕКСПОРТ ЗВІТУ (export_template): PDF — друк браузера («Зберегти як PDF»), DOC — Word-сумісний файл ═══ */
const MON_ABBR = ['Січ', 'Лют', 'Бер', 'Кві', 'Тра', 'Чер', 'Лип', 'Сер', 'Вер', 'Жов', 'Лис', 'Гру'];
const MON_FULL_G = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];
const RP_CODE = { rLab: 'Labor' };
/* період у назві файлу: 2026 · IV · Вер · 02Вер · 05-20Вер · 05Вер-20Жов */
function rpPeriodToken(a, b){
  const [ya, ma, da] = a.split('-').map(Number), [yb, mb, dbb] = b.split('-').map(Number), last = (y, m) => new Date(y, m, 0).getDate();
  if (a === b) return p2(da) + MON_ABBR[ma - 1];
  if (ya === yb && ma === 1 && da === 1 && mb === 12 && dbb === 31) return String(ya);
  if (ya === yb && da === 1 && ma === mb && dbb === last(yb, mb)) return MON_ABBR[ma - 1];
  if (ya === yb && da === 1 && (ma - 1) % 3 === 0 && mb === ma + 2 && dbb === last(yb, mb)) return ['I', 'II', 'III', 'IV'][(ma - 1) / 3];
  if (ya === yb && ma === mb) return `${p2(da)}-${p2(dbb)}${MON_ABBR[ma - 1]}`;
  return `${p2(da)}${MON_ABBR[ma - 1]}-${p2(dbb)}${MON_ABBR[mb - 1]}`;
}
function rpPeriodTitle(a, b){
  const [ya, ma, da] = a.split('-').map(Number), [yb, mb, dbb] = b.split('-').map(Number), tk = rpPeriodToken(a, b), rng = `${p2(da)}.${p2(ma)}–${p2(dbb)}.${p2(mb)}.${yb}`;
  if (a === b) return isoToUa(a);
  if (tk === String(ya)) return `${ya} рік (${rng})`;
  if (['I', 'II', 'III', 'IV'].includes(tk)) return `${tk} квартал ${ya} (${rng})`;
  if (ya === yb && da === 1 && ma === mb && MON_ABBR[ma - 1] === tk) return `${MON_FULL_G[ma - 1]} ${ya} (${rng})`;
  return `${isoToUa(a)} – ${isoToUa(b)}`;
}
function rpFileBase(){
  const t = new Date();
  return `ZV-${RP_CODE[rp.cur] || 'Rep'}-${rpPeriodToken(rp.data.a, rp.data.b)}-${p2(t.getDate())}${p2(t.getMonth() + 1)}${p2(t.getFullYear() % 100)}`;
}
const PX = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/* модель друкованої таблиці: однакова з екранною (вигляд, критерії, стовпці), але без кольорів; нулі → «—» */
function rpPrintModel(){
  const { a, b } = rp.data, rep = labReport(rp.data, rp.lab), money = can('jSums'), pay = FACILITY_TRACKS_PAYMENT && money && rp.cols.pay, cm = rp.cols.main, ce = rp.cols.extra, full = rp.detail === 'full';
  const dash = (v) => (v ? nfmt(v) : '—');
  const num = (g) => [...(cm ? [dash(g.n), ...(money ? [dash(g.base), dash(g.after)] : [])] : []), ...(ce ? [dash(g.exN), ...(money ? [dash(g.exSum)] : [])] : []), ...(pay ? [dash(g.cashless), dash(g.cash)] : [])];
  const numRaw = (g) => [...(cm ? [g.n, ...(money ? [g.base, g.after] : [])] : []), ...(ce ? [g.exN, ...(money ? [g.exSum] : [])] : []), ...(pay ? [g.cashless, g.cash] : [])];
  const numc = (g, b) => { const rw = numRaw(g); return num(g).map((t, i) => ({ t, v: rw[i], ...(b ? { b: true } : {}) })); };   // t — текст для друку, v — число для XLSX
  const leaf = [...(cm ? ['К-сть', ...(money ? ['Без пільг, грн', 'З пільгами, грн'] : [])] : []), ...(ce ? ['К-сть', ...(money ? ['Сума, грн'] : [])] : []), ...(pay ? ['Безготівка', 'Готівка'] : [])];
  const groups = [...(cm ? [['Основні послуги', money ? 3 : 1]] : []), ...(ce ? [['Додаткові', money ? 2 : 1]] : []), ...(pay ? [['Оплата, грн', 2]] : [])];
  const tps = (types) => Object.entries(types).sort((x, y) => x[0].localeCompare(y[0], 'uk')).map(([t, n]) => `${t} ${n}`).join(', ');
  const rows = [];
  if (!rep.list.length) rows.push({ k: 'r', cells: [{ t: '—' }, { t: '—' }, ...leaf.map(() => ({ t: '—' }))] });
  else if (!full){
    rep.list.forEach(L => rows.push({ k: 'r', cells: [{ t: nameOfW(L.wid), wid: L.wid, b: true, sub: labSchedText(L.wid, a, b) }, { t: `${L.count} (${tps(L.types)})`, c: 1 }, ...numc(L.tot)] }));
  } else {
    rep.list.forEach(L => {
      rows.push({ k: 'gh', wid: L.wid, cells: [{ t: `${nameOfW(L.wid)} · ${labSchedText(L.wid, a, b)}`, b: true, span: 2 + leaf.length }] });
      for (const s of L.shifts){
        const ds = [...s.dates.keys()].sort();
        ds.forEach((d, i) => rows.push({ k: 'r', cells: [{ t: isoToUa(d) + (ds.length > 1 ? (i ? ' ◣' : ' ◤') : '') }, ...(i ? [] : [{ t: s.tp + (s.out ? ' ⚠' : ''), c: 1, rs: ds.length }]), ...numc(s.dates.get(d))] }));
      }
      rows.push({ k: 'st', cells: [{ t: `Разом — ${plN(L.count, ['зміна', 'зміни', 'змін'])}`, b: true }, { t: tps(L.types), c: 1, b: true }, ...numc(L.tot, true)] });
    });
  }
  if (rep.list.length && !rp.lab){
    const n = rep.list.reduce((s, L) => s + L.count, 0), types = {}; rep.list.forEach(L => Object.entries(L.types).forEach(([t, c]) => { types[t] = (types[t] || 0) + c; }));
    rows.push({ k: 'tt', cells: [{ t: full ? `Разом усі — ${plN(n, ['зміна', 'зміни', 'змін'])}` : `Разом — ${plN(rep.list.length, ['лаборант', 'лаборанти', 'лаборантів'])}`, b: true }, { t: full ? tps(types) : `${n} (${tps(types)})`, c: 1, b: true }, ...numc(sumAgg(rep.list.map(L => L.tot)), true)] });
  }

function rpXlsx(m){

  const rr_ = (x) => `<r><rPr>${x.b ? '<b/>' : ''}<sz val="${x.sz || 11}"/><color rgb="${x.c || BLK}"/><rFont val="Arsenal"/></rPr><t xml:space="preserve">${esc2(x.t)}</t></r>`;

async function rpExport(kind){
  if (!rp.data) return toast('i', 'Спершу покажіть звіт', 'Експортується те, що відображено на екрані.');
  await rpFontReady();
  if (kind === 'xls'){
    const xx = rpXlsx(rpPrintModel()); rp.last = { kind, name: xx.name };
    const a = document.createElement('a'); a.href = URL.createObjectURL(xx.blob); a.download = xx.name + '.xlsx'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    return;
  }
  if (kind === 'doc'){
    const dx = rpDocx(rpPrintModel()); rp.last = { kind, name: dx.name };
    const a = document.createElement('a'); a.href = URL.createObjectURL(dx.blob); a.download = dx.name + '.docx'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    return;
  }
  const ex = rpPrintHtml(rpPrintModel(), false); rp.last = { kind, name: ex.name, html: ex.html, orient: ex.orient };
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(ex.html); d.close();
  const old = document.title; document.title = ex.name;   // Chrome пропонує цю назву як ім'я PDF-файлу
  const done = () => { document.title = old; setTimeout(() => f.remove(), 1000); };
  f.contentWindow.addEventListener('afterprint', done);
  (d.fonts && d.fonts.ready ? d.fonts.ready.catch(() => {}) : Promise.resolve()).then(() => setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e){ toast('e', 'Не вдалося відкрити друк', e.message || ''); done(); } }, 200));
}

}
